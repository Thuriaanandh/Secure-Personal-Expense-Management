<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .serif { font-family: 'Newsreader', Georgia, serif; }
    .mono { font-family: 'SF Mono', Consolas, Monaco, monospace; }
  </style>
</defs>
<rect width="1200" height="720" fill="#FBFBFA" />

<!-- Navigation Bar -->
<rect x="0" y="0" width="1200" height="70" fill="#FFFFFF" stroke="#EAE8E3" stroke-width="1" />
<text x="50" y="42" font-size="20" font-weight="600" fill="#242423" class="serif" letter-spacing="0.5">S P E M A</text>
<text x="145" y="42" font-size="12" fill="#8C8B88" letter-spacing="1">| SECURE EXPENSE</text>

<g font-size="13" font-weight="500" fill="#636361">
  <text x="450" y="41" fill="#2C4C3B" font-weight="600">Dashboard</text>
  <line x1="450" y1="52" x2="515" y2="52" stroke="#2C4C3B" stroke-width="2" />
  <text x="550" y="41">Transactions</text>
  <text x="660" y="41">Reports</text>
  <text x="745" y="41">Settings</text>
</g>

<!-- User & Logout -->
<circle cx="1060" cy="35" r="16" fill="#EAE8E3" />
<text x="1053" y="40" font-size="12" font-weight="600" fill="#636361">JD</text>
<text x="1090" y="40" font-size="13" fill="#636361">Logout</text>

<!-- Header Bar -->
<g transform="translate(50, 95)">
  <text x="0" y="25" font-size="24" font-weight="600" fill="#242423" class="serif">October 2026 Overview</text>
  <text x="0" y="45" font-size="12" fill="#636361">Personal financial summary scoped strictly to your account</text>
  
  <!-- Period Selector -->
  <rect x="750" y="8" width="170" height="36" rx="4" fill="#FFFFFF" stroke="#DCD9D3" stroke-width="1" />
  <text x="765" y="31" font-size="13" fill="#242423">October 2026</text>
  <polygon points="900,26 906,33 912,26" fill="#636361" />

  <!-- Add Button -->
  <rect x="940" y="8" width="160" height="36" rx="4" fill="#2C4C3B" />
  <text x="960" y="31" font-size="13" font-weight="600" fill="#FFFFFF">+ Add Transaction</text>
</g>

<!-- Summary Cards Grid -->
<g transform="translate(50, 170)">
  <!-- Card 1: Total Income -->
  <rect x="0" y="0" width="345" height="110" rx="6" fill="#FFFFFF" stroke="#EAE8E3" stroke-width="1" />
  <text x="25" y="32" font-size="12" font-weight="500" fill="#636361" letter-spacing="0.5">TOTAL INCOME</text>
  <text x="25" y="75" font-size="30" font-weight="600" fill="#2C4C3B" class="mono">$5,400.00</text>
  <text x="25" y="95" font-size="11" fill="#8C8B88">+12% from last month</text>

  <!-- Card 2: Total Expenses -->
  <rect x="375" y="0" width="345" height="110" rx="6" fill="#FFFFFF" stroke="#EAE8E3" stroke-width="1" />
  <text x="400" y="32" font-size="12" font-weight="500" fill="#636361" letter-spacing="0.5">TOTAL EXPENSES</text>
  <text x="400" y="75" font-size="30" font-weight="600" fill="#A64B2A" class="mono">$2,185.50</text>
  <text x="400" y="95" font-size="11" fill="#8C8B88">42 transactions logged</text>

  <!-- Card 3: Net Savings -->
  <rect x="750" y="0" width="350" height="110" rx="6" fill="#FFFFFF" stroke="#EAE8E3" stroke-width="1" />
  <text x="775" y="32" font-size="12" font-weight="500" fill="#636361" letter-spacing="0.5">NET CASH BALANCE</text>
  <text x="775" y="75" font-size="30" font-weight="600" fill="#242423" class="mono">+$3,214.50</text>
  <text x="775" y="95" font-size="11" fill="#2C4C3B">Healthy savings margin (59.5%)</text>
</g>

<!-- Category Spending Breakdown & Recent Feed -->
<g transform="translate(50, 310)">
  <!-- Left Panel: Category Breakdown -->
  <rect x="0" y="0" width="460" height="350" rx="6" fill="#FFFFFF" stroke="#EAE8E3" stroke-width="1" />
  <text x="25" y="35" font-size="16" font-weight="600" fill="#242423" class="serif">Spending by Category</text>
  
  <!-- Category Bar 1 -->
  <text x="25" y="75" font-size="13" fill="#242423">Housing &amp; Rent</text>
  <text x="435" y="75" font-size="13" fill="#242423" class="mono" text-anchor="end">$1,200.00 (54%)</text>
  <rect x="25" y="85" width="410" height="8" rx="4" fill="#F0EFEA" />
  <rect x="25" y="85" width="220" height="8" rx="4" fill="#2C4C3B" />

  <!-- Category Bar 2 -->
  <text x="25" y="125" font-size="13" fill="#242423">Groceries &amp; Food</text>
  <text x="435" y="125" font-size="13" fill="#242423" class="mono" text-anchor="end">$485.50 (22%)</text>
  <rect x="25" y="135" width="410" height="8" rx="4" fill="#F0EFEA" />
  <rect x="25" y="135" width="90" height="8" rx="4" fill="#588157" />

  <!-- Category Bar 3 -->
  <text x="25" y="175" font-size="13" fill="#242423">Utilities &amp; Bills</text>
  <text x="435" y="175" font-size="13" fill="#242423" class="mono" text-anchor="end">$280.00 (13%)</text>
  <rect x="25" y="185" width="410" height="8" rx="4" fill="#F0EFEA" />
  <rect x="25" y="185" width="53" height="8" rx="4" fill="#A3B18A" />

  <!-- Category Bar 4 -->
  <text x="25" y="225" font-size="13" fill="#242423">Entertainment</text>
  <text x="435" y="225" font-size="13" fill="#242423" class="mono" text-anchor="end">$220.00 (10%)</text>
  <rect x="25" y="235" width="410" height="8" rx="4" fill="#F0EFEA" />
  <rect x="25" y="235" width="41" height="8" rx="4" fill="#DDBEA9" />

  <!-- Right Panel: Recent Transactions -->
  <rect x="490" y="0" width="610" height="350" rx="6" fill="#FFFFFF" stroke="#EAE8E3" stroke-width="1" />
  <text x="515" y="35" font-size="16" font-weight="600" fill="#242423" class="serif">Recent Activity</text>
  <text x="1075" y="35" font-size="12" fill="#2C4C3B" font-weight="500" text-anchor="end">View All (42) &rarr;</text>

  <!-- Table Header -->
  <text x="515" y="70" font-size="11" font-weight="600" fill="#8C8B88">DATE</text>
  <text x="600" y="70" font-size="11" font-weight="600" fill="#8C8B88">CATEGORY</text>
  <text x="750" y="70" font-size="11" font-weight="600" fill="#8C8B88">DESCRIPTION</text>
  <text x="1075" y="70" font-size="11" font-weight="600" fill="#8C8B88" text-anchor="end">AMOUNT</text>
  <line x1="515" y1="80" x2="1075" y2="80" stroke="#EAE8E3" stroke-width="1" />

  <!-- Row 1 -->
  <text x="515" y="110" font-size="12" fill="#636361">2026-10-07</text>
  <text x="600" y="110" font-size="12" fill="#242423">Groceries</text>
  <text x="750" y="110" font-size="12" fill="#636361">Organic Supermarket</text>
  <text x="1075" y="110" font-size="13" font-weight="600" fill="#A64B2A" class="mono" text-anchor="end">-$64.20</text>

  <!-- Row 2 -->
  <text x="515" y="150" font-size="12" fill="#636361">2026-10-05</text>
  <text x="600" y="150" font-size="12" fill="#242423">Salary</text>
  <text x="750" y="150" font-size="12" fill="#636361">Monthly Payroll Deposit</text>
  <text x="1075" y="150" font-size="13" font-weight="600" fill="#2C4C3B" class="mono" text-anchor="end">+$5,400.00</text>

  <!-- Row 3 -->
  <text x="515" y="190" font-size="12" fill="#636361">2026-10-02</text>
  <text x="600" y="190" font-size="12" fill="#242423">Rent</text>
  <text x="750" y="190" font-size="12" fill="#636361">Apartment Monthly Lease</text>
  <text x="1075" y="190" font-size="13" font-weight="600" fill="#A64B2A" class="mono" text-anchor="end">-$1,200.00</text>

  <!-- Row 4 -->
  <text x="515" y="230" font-size="12" fill="#636361">2026-10-01</text>
  <text x="600" y="230" font-size="12" fill="#242423">Utilities</text>
  <text x="750" y="230" font-size="12" fill="#636361">Internet &amp; Power Grid</text>
  <text x="1075" y="230" font-size="13" font-weight="600" fill="#A64B2A" class="mono" text-anchor="end">-$145.00</text>
</g>

</svg>