<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .serif { font-family: 'Newsreader', Georgia, serif; }
    .mono { font-family: 'SF Mono', Consolas, Monaco, monospace; }
  </style>
</defs>
<rect width="1200" height="720" fill="#FBFBFA" />

<!-- Center Container -->
<rect x="400" y="100" width="400" height="520" rx="6" fill="#FFFFFF" stroke="#EAE8E3" stroke-width="1" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.03))" />

<text x="600" y="160" font-size="26" font-weight="600" fill="#242423" class="serif" text-anchor="middle">Welcome Back</text>
<text x="600" y="190" font-size="13" fill="#636361" text-anchor="middle">Access your private personal expense ledger</text>

<!-- Email Field -->
<text x="440" y="240" font-size="12" font-weight="500" fill="#242423">Email Address</text>
<rect x="440" y="250" width="320" height="42" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" />
<text x="455" y="276" font-size="13" fill="#8C8B88">user@example.com</text>

<!-- Password Field -->
<text x="440" y="325" font-size="12" font-weight="500" fill="#242423">Password</text>
<rect x="440" y="335" width="320" height="42" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" />
<text x="455" y="361" font-size="14" fill="#242423" class="mono">&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;</text>

<!-- Security Assurance Badge -->
<rect x="440" y="395" width="320" height="30" rx="3" fill="#F4F7F5" stroke="#D2E0D8" stroke-width="1" />
<circle cx="455" cy="410" r="5" fill="#2C4C3B" />
<text x="468" y="414" font-size="11" fill="#2C4C3B">Protected by Argon2id &amp; Rate-Limited Login</text>

<!-- Submit Button -->
<rect x="440" y="445" width="320" height="44" rx="4" fill="#2C4C3B" />
<text x="600" y="472" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Sign In to Account</text>

<!-- Footer Link -->
<text x="600" y="530" font-size="12" fill="#636361" text-anchor="middle">Don't have an account? <tspan fill="#2C4C3B" font-weight="600">Register securely</tspan></text>
<text x="600" y="570" font-size="11" fill="#A8A7A3" text-anchor="middle">End-to-End Tenant Isolation Enforced Server-Side</text>

</svg>