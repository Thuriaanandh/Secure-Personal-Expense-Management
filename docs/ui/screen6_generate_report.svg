<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .serif { font-family: 'Newsreader', Georgia, serif; }
    .mono { font-family: 'SF Mono', Consolas, Monaco, monospace; }
  </style>
</defs>
<rect width="1200" height="720" fill="#FBFBFA" />

<!-- Navigation Bar -->
<rect x="0" y="0" width="1200" height="70" fill="#FFFFFF" stroke="#EAE8E3" stroke-width="1" />
<text x="50" y="42" font-size="20" font-weight="600" fill="#242423" class="serif" letter-spacing="0.5">S P E M A</text>
<text x="145" y="42" font-size="12" fill="#8C8B88" letter-spacing="1">| SECURE EXPENSE</text>

<g font-size="13" font-weight="500" fill="#636361">
  <text x="450" y="41" fill="#2C4C3B" font-weight="600">Dashboard</text>
  <line x1="450" y1="52" x2="515" y2="52" stroke="#2C4C3B" stroke-width="2" />
  <text x="550" y="41">Transactions</text>
  <text x="660" y="41">Reports</text>
  <text x="745" y="41">Settings</text>
</g>

<!-- User & Logout -->
<circle cx="1060" cy="35" r="16" fill="#EAE8E3" />
<text x="1053" y="40" font-size="12" font-weight="600" fill="#636361">JD</text>
<text x="1090" y="40" font-size="13" fill="#636361">Logout</text>

<g transform="translate(300, 95)">
  <rect x="0" y="0" width="600" height="560" rx="6" fill="#FFFFFF" stroke="#EAE8E3" stroke-width="1" />
  
  <text x="40" y="45" font-size="22" font-weight="600" fill="#242423" class="serif">Export Financial Report</text>
  <text x="40" y="70" font-size="12" fill="#636361">Download an auditable, formula-sanitized financial statement</text>
  
  <!-- Period Selector -->
  <text x="40" y="115" font-size="12" font-weight="500" fill="#242423">Report Time Span</text>
  <g transform="translate(40, 125)">
    <rect x="0" y="0" width="120" height="34" rx="4" fill="#2C4C3B" /><text x="60" y="21" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">October 2026</text>
    <rect x="130" y="0" width="120" height="34" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" /><text x="190" y="21" font-size="12" fill="#636361" text-anchor="middle">Last 3 Months</text>
    <rect x="260" y="0" width="120" height="34" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" /><text x="320" y="21" font-size="12" fill="#636361" text-anchor="middle">Year to Date</text>
    <rect x="390" y="0" width="130" height="34" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" /><text x="455" y="21" font-size="12" fill="#636361" text-anchor="middle">Custom Range...</text>
  </g>

  <!-- Included Data Types -->
  <text x="40" y="195" font-size="12" font-weight="500" fill="#242423">Transaction Types</text>
  <rect x="40" y="205" width="520" height="40" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" />
  <text x="55" y="230" font-size="13" fill="#242423">Both Income &amp; Expenses (Consolidated Ledger)</text>
  <polygon points="535,225 541,232 547,225" fill="#636361" />

  <!-- Output Format -->
  <text x="40" y="275" font-size="12" font-weight="500" fill="#242423">File Format</text>
  <g transform="translate(40, 285)">
    <rect x="0" y="0" width="250" height="42" rx="4" fill="#F4F7F5" stroke="#2C4C3B" stroke-width="1.5" />
    <circle cx="20" cy="21" r="6" fill="#2C4C3B" />
    <text x="35" y="26" font-size="13" font-weight="600" fill="#2C4C3B">CSV (Spreadsheet Compatible)</text>

    <rect x="270" y="0" width="250" height="42" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" />
    <circle cx="290" cy="21" r="6" fill="#DCD9D3" />
    <text x="305" y="26" font-size="13" fill="#636361">JSON (Structured Audit Feed)</text>
  </g>

  <!-- Security Hardening Box -->
  <rect x="40" y="355" width="520" height="75" rx="4" fill="#F4F7F5" stroke="#D2E0D8" stroke-width="1" />
  <text x="55" y="378" font-size="12" font-weight="600" fill="#2C4C3B">&#128737; Active Security Controls on Report Export:</text>
  <text x="55" y="398" font-size="11" fill="#4B6354">&bull; Zero-Trust Tenant Scoping: Export encompasses solely current_user.id records.</text>
  <text x="55" y="415" font-size="11" fill="#4B6354">&bull; Formula Injection Immunity: All cells starting with =, +, -, @ sanitized (CWE-1236).</text>

  <!-- Export Trigger -->
  <rect x="40" y="460" width="240" height="44" rx="4" fill="#2C4C3B" />
  <text x="160" y="487" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">&#10515; Download Sanitized CSV</text>

  <rect x="300" y="460" width="120" height="44" rx="4" fill="#FFFFFF" stroke="#DCD9D3" stroke-width="1" />
  <text x="360" y="487" font-size="13" fill="#636361" text-anchor="middle">Cancel</text>
</g>

</svg>