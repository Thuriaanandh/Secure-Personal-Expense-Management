<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .serif { font-family: 'Newsreader', Georgia, serif; }
    .mono { font-family: 'SF Mono', Consolas, Monaco, monospace; }
  </style>
</defs>
<rect width="1200" height="720" fill="#FBFBFA" />

<!-- Navigation Bar -->
<rect x="0" y="0" width="1200" height="70" fill="#FFFFFF" stroke="#EAE8E3" stroke-width="1" />
<text x="50" y="42" font-size="20" font-weight="600" fill="#242423" class="serif" letter-spacing="0.5">S P E M A</text>
<text x="145" y="42" font-size="12" fill="#8C8B88" letter-spacing="1">| SECURE EXPENSE</text>

<g font-size="13" font-weight="500" fill="#636361">
  <text x="450" y="41" fill="#2C4C3B" font-weight="600">Dashboard</text>
  <line x1="450" y1="52" x2="515" y2="52" stroke="#2C4C3B" stroke-width="2" />
  <text x="550" y="41">Transactions</text>
  <text x="660" y="41">Reports</text>
  <text x="745" y="41">Settings</text>
</g>

<!-- User & Logout -->
<circle cx="1060" cy="35" r="16" fill="#EAE8E3" />
<text x="1053" y="40" font-size="12" font-weight="600" fill="#636361">JD</text>
<text x="1090" y="40" font-size="13" fill="#636361">Logout</text>

<g transform="translate(300, 95)">
  <rect x="0" y="0" width="600" height="560" rx="6" fill="#FFFFFF" stroke="#EAE8E3" stroke-width="1" />
  
  <text x="40" y="45" font-size="22" font-weight="600" fill="#242423" class="serif">Record Transaction</text>
  <text x="40" y="70" font-size="12" fill="#636361">Transaction will be permanently associated with your authenticated session</text>
  
  <!-- Type Toggle -->
  <text x="40" y="110" font-size="12" font-weight="500" fill="#242423">Transaction Type</text>
  <rect x="40" y="120" width="250" height="38" rx="4" fill="#F4F7F5" stroke="#2C4C3B" stroke-width="1.5" />
  <circle cx="60" cy="139" r="6" fill="#2C4C3B" />
  <text x="75" y="144" font-size="13" font-weight="600" fill="#2C4C3B">Income (+)</text>

  <rect x="310" y="120" width="250" height="38" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" />
  <circle cx="330" cy="139" r="6" fill="#DCD9D3" />
  <text x="345" y="144" font-size="13" fill="#636361">Expense (-)</text>

  <!-- Amount -->
  <text x="40" y="195" font-size="12" font-weight="500" fill="#242423">Amount (USD)</text>
  <rect x="40" y="205" width="520" height="42" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" />
  <text x="55" y="232" font-size="16" font-weight="600" fill="#242423" class="mono">$ 150.00</text>

  <!-- Date & Category (Two columns) -->
  <text x="40" y="280" font-size="12" font-weight="500" fill="#242423">Date</text>
  <rect x="40" y="290" width="250" height="40" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" />
  <text x="55" y="315" font-size="13" fill="#242423">2026-10-08</text>

  <text x="310" y="280" font-size="12" font-weight="500" fill="#242423">Category</text>
  <rect x="310" y="290" width="250" height="40" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" />
  <text x="325" y="315" font-size="13" fill="#242423">Consulting / Freelance</text>
  <polygon points="535,310 541,317 547,310" fill="#636361" />

  <!-- Description / Notes -->
  <text x="40" y="365" font-size="12" font-weight="500" fill="#242423">Description / Note (Max 255 chars, Optional)</text>
  <rect x="40" y="375" width="520" height="55" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" />
  <text x="55" y="402" font-size="13" fill="#636361">Q3 Security Architecture Review Milestone</text>

  <!-- Security Notice -->
  <rect x="40" y="450" width="520" height="30" rx="3" fill="#FBFBFA" stroke="#EAE8E3" stroke-width="1" />
  <text x="55" y="470" font-size="11" fill="#8C8B88">&#128274; Client cannot specify user_id; ownership is bound to verified token session.</text>

  <!-- Buttons -->
  <rect x="40" y="500" width="180" height="42" rx="4" fill="#2C4C3B" />
  <text x="130" y="526" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Save Transaction</text>

  <rect x="235" y="500" width="120" height="42" rx="4" fill="#FFFFFF" stroke="#DCD9D3" stroke-width="1" />
  <text x="295" y="526" font-size="13" fill="#636361" text-anchor="middle">Cancel</text>
</g>

</svg>