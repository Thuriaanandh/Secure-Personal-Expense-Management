<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .serif { font-family: 'Newsreader', Georgia, serif; }
    .mono { font-family: 'SF Mono', Consolas, Monaco, monospace; }
  </style>
</defs>
<rect width="1200" height="720" fill="#FBFBFA" />

<rect x="380" y="60" width="440" height="600" rx="6" fill="#FFFFFF" stroke="#EAE8E3" stroke-width="1" />
<text x="600" y="115" font-size="26" font-weight="600" fill="#242423" class="serif" text-anchor="middle">Create Private Ledger</text>
<text x="600" y="140" font-size="13" fill="#636361" text-anchor="middle">Your financial data is completely isolated from other users</text>

<!-- Email -->
<text x="420" y="180" font-size="12" font-weight="500" fill="#242423">Email Address</text>
<rect x="420" y="190" width="360" height="38" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" />
<text x="435" y="214" font-size="13" fill="#8C8B88">you@domain.com</text>

<!-- Username -->
<text x="420" y="250" font-size="12" font-weight="500" fill="#242423">Username</text>
<rect x="420" y="260" width="360" height="38" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" />
<text x="435" y="284" font-size="13" fill="#8C8B88">finance_user</text>

<!-- Password -->
<text x="420" y="320" font-size="12" font-weight="500" fill="#242423">Password</text>
<rect x="420" y="330" width="360" height="38" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" />
<text x="435" y="354" font-size="13" fill="#242423" class="mono">&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;</text>

<!-- Password Strength Criteria -->
<g font-size="11" fill="#636361">
  <circle cx="430" cy="385" r="4" fill="#2C4C3B" /><text x="440" y="388" fill="#2C4C3B">10+ Characters</text>
  <circle cx="530" cy="385" r="4" fill="#2C4C3B" /><text x="540" y="388" fill="#2C4C3B">Uppercase &amp; Lower</text>
  <circle cx="650" cy="385" r="4" fill="#2C4C3B" /><text x="660" y="388" fill="#2C4C3B">Number &amp; Symbol</text>
</g>

<!-- Confirm Password -->
<text x="420" y="420" font-size="12" font-weight="500" fill="#242423">Confirm Password</text>
<rect x="420" y="430" width="360" height="38" rx="4" fill="#FBFBFA" stroke="#DCD9D3" stroke-width="1" />
<text x="435" y="454" font-size="13" fill="#242423" class="mono">&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;</text>

<!-- Submit -->
<rect x="420" y="495" width="360" height="42" rx="4" fill="#2C4C3B" />
<text x="600" y="521" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Create Isolated Account</text>

<text x="600" y="565" font-size="12" fill="#636361" text-anchor="middle">Already registered? <tspan fill="#2C4C3B" font-weight="600">Log in</tspan></text>

</svg>