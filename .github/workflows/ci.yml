name: Secure Build & CI Pipeline

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  security-and-quality:
    name: Security Scan & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit

      - name: Run Ruff Static Linter
        run: |
          ruff check src/ tests/

      - name: Run Bandit SAST Security Scan
        run: |
          bandit -c bandit.yaml -r src/ -ll -ii

      - name: Run Secret Scan
        run: |
          python scripts/security_check.py

  automated-testing:
    name: Automated Unit, Integration & Security Tests
    runs-on: ubuntu-latest
    needs: security-and-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Suite (Unit, Integration, IDOR & Security Tests)
        env:
          SECRET_KEY: "ci-testing-secret-key-minimum-32-bytes-long-for-security"
          DATABASE_URL: "sqlite:///./test_ci.db"
          APP_ENV: "testing"
        run: |
          pytest -v tests/

      - name: Verify Application Startup
        env:
          SECRET_KEY: "ci-testing-secret-key-minimum-32-bytes-long-for-security"
          DATABASE_URL: "sqlite:///./test_ci_app.db"
          APP_ENV: "testing"
        run: |
          python -c "from src.app.main import app; print('FastAPI application initialized successfully.')"
