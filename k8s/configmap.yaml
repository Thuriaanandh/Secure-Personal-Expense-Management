apiVersion: v1
kind: ConfigMap
metadata:
  name: spema-config
  namespace: spema
  labels:
    app.kubernetes.io/name: spema
    app.kubernetes.io/part-of: spema-ledger
data:
  APP_ENV: "production"
  PROJECT_NAME: "Secure Personal Expense Management Application"
  DATABASE_URL: "sqlite:////data/spema_ledger.db"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  RATE_LIMIT_LOGIN_MAX_ATTEMPTS: "5"
  RATE_LIMIT_LOGIN_WINDOW_SECONDS: "900"
  CORS_ORIGINS: '["http://localhost:8000","http://127.0.0.1:8000"]'
