apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spema-network-policy
  namespace: spema
  labels:
    app.kubernetes.io/name: spema
    app.kubernetes.io/part-of: spema-ledger
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spema
      app.kubernetes.io/component: web-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound HTTP traffic on port 8000 from within cluster and ingress
    - from: []
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS egress for any external verification/API endpoints if needed
    - to: []
      ports:
        - protocol: TCP
          port: 443
