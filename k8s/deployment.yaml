apiVersion: apps/v1
kind: Deployment
metadata:
  name: spema-deployment
  namespace: spema
  labels:
    app.kubernetes.io/name: spema
    app.kubernetes.io/component: web-service
    app.kubernetes.io/part-of: spema-ledger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: spema
      app.kubernetes.io/component: web-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spema
        app.kubernetes.io/component: web-service
    spec:
      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: spema-app
          image: spema:1.2.0
          imagePullPolicy: IfNotPresent
          
          # Container-level security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Resource requests and limits
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          # Liveness and Readiness Probes
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          # Decoupled Configuration & Secrets Injection
          envFrom:
            - configMapRef:
                name: spema-config
            - secretRef:
                name: spema-secret

          # Volume mounts for database persistence and temporary storage
          volumeMounts:
            - name: data-volume
              mountPath: /data
            - name: tmp-volume
              mountPath: /tmp

      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: spema-data-pvc
        - name: tmp-volume
          emptyDir: {}
